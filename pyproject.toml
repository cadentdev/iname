[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "iname"
version = "0.2.0"
description = "Internet Name — make filenames safe and consistent for the web"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Neil Johnson"},
]
keywords = ["filename", "rename", "web", "sanitize", "cli", "unix"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.scripts]
iname = "iname.cli:main"

[project.urls]
Homepage = "https://github.com/cadentdev/iname"
Repository = "https://github.com/cadentdev/iname"
Issues = "https://github.com/cadentdev/iname/issues"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1,<10"
pytest-cov = ">=7.1,<8"
ruff = ">=0.16,<0.17"

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
